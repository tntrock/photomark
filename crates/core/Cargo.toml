[package]
name = "photomark-core"
description = "Crop- and rescale-resistant invisible image watermarking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image.workspace = true
rayon.workspace = true
rustfft = "6.2"
sha2 = "0.10"
ndarray = "0.16"
ureq = "2.12"

# ONNX Runtime ships prebuilt static libraries for MSVC only; other toolchains load
# onnxruntime.dll at run time from the models folder.
[target.'cfg(target_env = "msvc")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
