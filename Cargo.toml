[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/tntrock/photomark"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
rayon = "1.10"

# The watermark maths is far too slow unoptimised, so optimise it even in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.photomark-core]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
